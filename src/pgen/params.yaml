---
problem(advection):
  _description: "<problem> block parameters when artemis/problem=advection"
  amp:
    _type: Real
    _description: "Amplitude of perturbation"
  vflow:
    _type: Real
    _default: 0.0
    _description: "Background velocity parallel to wavevector"
  nperiod:
    _type: Real
    _default: 1.0
    _description: "Sets new time limit to the specified number of periods"
  along_x(1,2,3):
    _type: bool
    _default: "false"
    _description: "Wavevctor along x(1,2,3) axis"

problem(blast):
  _description: "<problem> block parameters when artemis/problem=blast"
  radius:
    _type: Real
    _default: 1.0
    _description: "Initial radius of blast wave"
  height:
    _type: Real
    _default: 1.0
    _description: "Initial height of blast wave"
  internal_energy:
    _type: Real
    _default: 1.0
    _description: "Internal energy of blast wave"
  p0:
    _type: Real
    _default: 1.0
    _description: "Background presure"
  d0:
    _type: Real
    _default: 1.0
    _description: "Background density"
  x(1,2,3):
    _type: Real
    _default: 0.0
    _description: "Coordinates of the blast wave center"
  samples:
    _type: int
    _default: -1
    _description: "Amount of subsampling to do when setting the initial blast. If < 0, only use the center of the cell."
  symmetry:
    _type: string
    _default: "spherical"
    _description: "Is this a spherical or cylindrical blast wave?"

problem(conduction):
  _description: "<problem> block parameters when artemis/problem=conduction"
  gas_rho:
    _type: Real
    _default: 1.0
    _description: "Background gas density."
  gas_vx(1,2,3):
    _type: Real
    _default: 0.0
    _description: "Background gas velocity."
  gas_temp :
    _type: Real
    _default: 1.0
    _description: "Background gas temperature."
  flux:
    _type: Real
    _default: 0.0
    _description: "The specified heat flux when using conductive boundaries."

problem(constant):
  _description: "<problem> block parameters when artemis/problem=constant"
  gas_rho:
    _type: Real
    _default: 1.0
    _description: "Background gas density."
  gas_vx(1,2,3):
    _type: Real
    _default: 0.0
    _description: "Background gas velocity."
  gas_temp :
    _type: Real
    _default: 1.0
    _description: "Background gas temperature"
  dust_rho:
    _type: Real
    _default: 1.0
    _description: "Background dust density."
  dust_vx(1,2,3):
    _type: Real
    _default: 0.0
    _description: "Background dust velocity."

problem(disk):
  _description: "<problem> block parameters when artemis/problem=disk"
  r0:
    _type: Real
    _default: 1.0
    _description: "Reference radius."
    _units: "au"
  h0:
    _type: Real
    _default: "0.05"
    _description: "Aspect ratio of the disk at r0"
  rho0:
    _type: Real
    _description: "Density of the disk at r0."
    _units: "g cm^-3"
  dslope:
    _type: Real
    _default: "-2.25"
    _description: "Density power law"
  tslope:
    _type: Real
    _default: "-1.0"
    _description: "Temperature power law. This is mutually exclusive with flare"
  flare:
    _type: Real
    _default: "0.0"
    _description: "Flaring index. This is mutually exclusive with tslope"
  rexp:
    _type: Real
    _default: "0.0"
    _description: "Exponential cutoff radius for the density profile"
  rcav:
    _type: Real
    _default: "0.0"
    _description: "Inner cavity radius for the density profile."
    _units: "au"
  l0:
    _type: Real
    _default: "0.0"
    _description: "Guess for the binary eignvalue that reduces the density near the outer boundary"
  polytropic_index:
    _type: Real
    _default: "gas/gamma"
    _description: "The polytropic index of the initial disk profile. Defaults to the gas adiabatic index"
  mdot:
    _type: Real
    _description: "Specified mass flux through the disk. This is used to set the density normalization and the viscous outer boundary condition inflow rate."
    _units: "g s^-1"
  quiet_start:
    _type: bool
    _default: "false"
    _description: "If set to true, the initial radial velocity is set to zero. If set to false, the initial radial velocity is the viscous velocity."
  dens_min:
    _type: Real
    _default: "1e-5"
    _description: "Floor density."
    _units: "g cm^-3"
  pres_min:
    _type: Real
    _default: "1e-8"
    _description: "Floor pressure."
    _units: "erg cm^-3"
  dust_to_gas:
    _type: Real
    _default: "0.01"
    _description: "Dust to gas ratio"

problem(gaussian_bump):
  _description: "<problem> block parameters when artemis/problem=gaussian_bump"
  x(1,2,3)c:
    _type: Real
    _default: 0.0
    _description: "Center of the bump."
  sigma:
    _type: Real
    _description: "Width of the bump."
  density_bump:
    _type: Real
    _default: 0.0
    _description: "Density bump value."
  temperature_bump:
    _type: Real
    _default: 0.0
    _description: "Temperature bump value"
  vx(1,2,3)_bump:
    _type: Real
    _default: 0.0
    _description: "Velocity of the bump."
  gas_rho:
    _type: Real
    _default: 1.0
    _description: "Background gas density."
  gas_vx(1,2,3):
    _type: Real
    _default: 0.0
    _description: "Background gas velocity."
  gas_pres:
    _type: Real
    _default: 1.0
    _description: "Background gas pressure."
  dust_rho:
    _type: Real
    _default: 1.0
    _description: "Background dust density."
  dust_vx(1,2,3):
    _type: Real
    _default: 0.0
    _description: "Background dust velocity."

problem(field_loop):
  _description: "<problem> block parameters when artemis/problem=field_loop"
  loop_type:
    _type: string
    _default: "planar"
    _description: "Field-loop geometry: planar (2D) or tilted (3D)"
  radius:
    _type: Real
    _default: 0.3
    _description: "Radius of the magnetic loop in local loop coordinates"
  amp:
    _type: Real
    _default: 1.0e-3
    _description: "Vector-potential amplitude"
  vflow:
    _type: Real
    _default: 1.0
    _description: "Advection speed along the periodic diagonal"
  v3:
    _type: Real
    _default: 0.0
    _description: "Uniform x3 velocity for the planar 2D loop"
  rho0:
    _type: Real
    _default: 1.0
    _description: "Uniform gas density"
  p0:
    _type: Real
    _default: 1.0
    _description: "Uniform gas pressure"
  x0:
    _type: Real
    _default: 0.0
    _description: "Loop-center x coordinate in local loop coordinates"
  y0:
    _type: Real
    _default: 0.0
    _description: "Loop-center y coordinate in local loop coordinates"
  nperiod:
    _type: Real
    _default: 1.0
    _description: "Number of periodic crossings to evolve"

problem(linear_wave):
  _description: "<problem> block parameters when artemis/problem=linear_wave"
  wave_flag:
    _type: int
    _description: "Wave flag: [0,4] for hydro or [0,6] for MHD"
  amp:
    _type: Real
    _description: "Wave amplitude"
  vflow:
    _type: Real
    _default: 0.0
    _description: "Background velocity parallel to wavevector"
  nperiod:
    _type: Real
    _default: 1.0
    _description: "Sets new time limit to the specified number of periods"
  along_x(1,2,3):
    _type: bool
    _default: "false"
    _description: "Set the wavevector along the x(1,2,3) axis"

problem(orszag_tang):
  _description: "<problem> block parameters when artemis/problem=orszag_tang"
  rho0:
    _type: Real
    _default: 25.0 / (36.0 * pi)
    _description: "Uniform background density"
  p0:
    _type: Real
    _default: 5.0 / (12.0 * pi)
    _description: "Uniform background gas pressure"
  v0:
    _type: Real
    _default: 1.0
    _description: "Velocity amplitude for the vortex pattern"
  b0:
    _type: Real
    _default: 1.0 / sqrt(4.0 * pi)
    _description: "Magnetic-field amplitude for the standard Orszag-Tang pattern"

problem(shock):
  _description: "<problem> block parameters when artemis/problem=shock"
  rhol:
    _type: Real
    _default: 1.0
    _description: "Density (left)."
  vxl:
    _type: Real
    _default: 2.0
    _description: "X1-velocity (left)."
  tl:
    _type: Real
    _default: 0.6
    _description: "Temperature (left). Used when pl < 0."
  pl:
    _type: Real
    _default: -1.0
    _description: "Pressure (left). If >= 0, overrides tl."
  rhor:
    _type: Real
    _default: 2.285714
    _description: "Density (right)."
  vxr:
    _type: Real
    _default: 0.875000
    _description: "X1-velocity (right)."
  tr:
    _type: Real
    _default: 1.246875
    _description: "Temperature (right). Used when pr < 0."
  pr:
    _type: Real
    _default: -1.0
    _description: "Pressure (right). If >= 0, overrides tr."
  bx:
    _type: Real
    _default: 0.0
    _description: "Uniform normal magnetic field Bx."
  byl:
    _type: Real
    _default: 0.0
    _description: "Left transverse magnetic field By."
  byr:
    _type: Real
    _default: 0.0
    _description: "Right transverse magnetic field By."
  bzl:
    _type: Real
    _default: 0.0
    _description: "Left transverse magnetic field Bz."
  bzr:
    _type: Real
    _default: 0.0
    _description: "Right transverse magnetic field Bz."
  xdisc:
    _type: Real
    _default: 0.0005
    _description: "Discontinuity location (X1)."

problem(strat):
  _description: "<problem> block parameters when artemis/problem=strat"
  h:
    _type: Real
    _default: 1.0
    _description: "Scale height of the disk"
  rho0:
    _type: Real
    _default: 1.0
    _description: "Background density."
  dens_min:
    _type: Real
    _default: "1e-5"
    _description: "Floor density."
  pres_min:
    _type: Real
    _default: "1e-8"
    _description: "Floor pressure."
  d2g:
    _type: Real
    _default: "0.01"
    _description: "Dust to gas ratio"

problem(thermalization):
  _description: "<problem> block parameters when artemis/problem=thermalization"
  rho:
    _type: Real
    _default: 1.0
    _description: "Background density."
  vx:
    _type: Real
    _default: 0.0
    _description: "Background X1-velocity."
  tgas:
    _type: Real
    _default: 2.0
    _description: "Background gas temperature."
  trad:
    _type: Real
    _default: 1.0
    _description: "Background radiation temperature."

problem(crooked_pipe):
  _description: "<problem> block parameters when artemis/problem=crooked_pipe"
  rho_thick:
    _type: Real
    _default: 100.0
    _description: "Thick material density."
  rho_thin:
    _type: Real
    _default: 1.0
    _description: "Thin material density."
  t_source:
    _type: Real
    _default: 100.0
    _description: "Source region temperature."
  t_init:
    _type: Real
    _default: 1.0
    _description: "Non-source initial temperature."
