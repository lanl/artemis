---
rotating_frame:
  _description: "Rotating frame module. This adds the centrifugal, Coriolis forces, and shearing box forces."
  omega:
    _type: Real
    _default: 0.0
    _description: "Frame rotation rate. Aligned with z."
    _units: "radian s^-1"
  qshear:
    _type: Real
    _default: 0.0
    _description: "Shear rate of the shearing box. Set to -1.5 for Keplerian shear."
  gm:
    _type: Real
    _default: 0.0
    _description: "GM of central point mass for orbital advection. Used to compute the Keplerian rotation rate."
  reconstruct:
    _type: string
    _default: plm
    _description: "Reconstruction algorithm for remap."
    pcm:
      _type: opt
      _description: "Piecewise Constant"
    plm:
      _type: opt
      _description: "Piecewise Linear"
    ppm:
      _type: opt
      _description: "Piecewise Parabolic"
    wenoz:
      _type: opt
      _description: "Weighted Essentially Non Oscillatory (Z)"
    wenomz:
      _type: opt
      _description: "Weighted Essentially Non Oscillatory (MZ)"
    cfl:
      _type: Real
      _default: 0.8
      _description:  "CFL number used for remap subcycling"
    dt_ratio:
      _type: Real
      _default: 10.0
      _description:  "Multiple of dt_advect taken in remap subcycler"
